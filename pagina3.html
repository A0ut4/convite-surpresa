<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surpresa Final 🎁</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 360px;
      width: 90%;
      animation: fadeIn 1.2s ease;
    }

    h1 {
      color: #ff4b5c;
      font-size: 1.6em;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1em;
      color: #444;
      margin-bottom: 25px;
    }

    a {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #ff4b5c, #ff7a7a);
      color: white;
      padding: 15px 22px;
      border-radius: 30px;
      font-size: 1.1em;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    a:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎉 Chegamos ao final!</h1>
    <p>
      Não preciso de presente…<br>
      💖 sua amizade já é um belo presente 💖<br><br>
      Mas se quiser olhar com carinho 👀✨  
    </p>

    <a href="https://www.amazon.com.br/hz/wishlist/ls/1D76ACA5F3LDB?ref_=wl_share" target="_blank">
      Abrir lista de desejos 🎁
    </a>
  </div>

</body>
</html>
